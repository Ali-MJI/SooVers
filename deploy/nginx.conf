# Insert this location in your existing HTTPS server block.
# Keep TLS certificates, server_name and other applications in the host configuration.
location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
# For a subpath deployment, use location /soovers/ with
# proxy_pass http://127.0.0.1:8080/; (the trailing slash removes the prefix).
# The built JS, CSS and fonts use relative URLs.
